schema_version = 1

# One bounded core candidate smoke per canonical target.
#
# `--version` is the stronger identity check: it proves the exact candidate
# executes and identifies itself as `cargo-cleanme X.Y.Z`. A single fixed argv
# cannot also cover `--help`, a bounded read-only scan, or JSON output, so the
# per-target release step stays minimal and the richer product runtime smoke is
# expressed once, portably, as the per-target consumer validator in
# `consumer-validators.json`.

[targets."aarch64-apple-darwin"]
[targets."aarch64-apple-darwin".smoke]
selector = { kind = "direct" }
argv = ["--version"]
timeout_ms = 10000
stdout_limit = 8192
stderr_limit = 8192

[targets."aarch64-unknown-linux-gnu"]
[targets."aarch64-unknown-linux-gnu".smoke]
selector = { kind = "direct" }
argv = ["--version"]
timeout_ms = 10000
stdout_limit = 8192
stderr_limit = 8192

