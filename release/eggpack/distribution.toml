schema_version = 1

# Producer release contract for cargo-cleanme, owned by Eggpack since M010A.
#
# This file is the single authority for the published target set, release
# asset names, install names, and checksum sidecar names. It is static: it
# carries no release tag, no source revision, and no artifact digest.
#
# Public asset names are version-free by contract; `releases/latest/download`
# and `releases/download/vX.Y.Z` both resolve the same file name, so the
# product-owned `packaging/install.sh` and `packaging/install.ps1` wrappers can
# select latest or an exact version without a second naming scheme.
#
# ARMv7 (`armv7-unknown-linux-gnueabihf`) is intentionally absent. It stays a
# product-recognized Cargo-fallback-only host in the product wrappers and in
# the M010C updater until a separate executable or emulated qualification gate
# is planned; declaring it here would imply a published artifact that does not
# exist.

[product]
id = "cargo-cleanme"
display_name = "cargo-cleanme"

[[targets]]
triple = "aarch64-apple-darwin"
aliases = ["macos-arm64"]

[targets.asset]
kind = "direct"
asset = "{product}-{target}"
install = "{product}"

[targets.checksum]
sidecar = "{asset}.sha256"

[[targets]]
triple = "aarch64-unknown-linux-gnu"
aliases = ["linux-arm64"]

[targets.asset]
kind = "direct"
asset = "{product}-{target}"
install = "{product}"

[targets.checksum]
sidecar = "{asset}.sha256"

[[targets]]
triple = "x86_64-apple-darwin"
aliases = ["macos-x64"]

[targets.asset]
kind = "direct"
asset = "{product}-{target}"
install = "{product}"

[targets.checksum]
sidecar = "{asset}.sha256"

[[targets]]
triple = "x86_64-pc-windows-msvc"
aliases = ["windows-x64"]

[targets.asset]
kind = "direct"
asset = "{product}-{target}.exe"
install = "{product}.exe"

[targets.checksum]
sidecar = "{asset}.sha256"

[[targets]]
triple = "x86_64-unknown-linux-gnu"
aliases = ["linux-x64"]

[targets.asset]
kind = "direct"
asset = "{product}-{target}"
install = "{product}"

[targets.checksum]
sidecar = "{asset}.sha256"
