[package]
name = "cargo-cleanme"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "Find inactive Cargo artifacts and safely preview their cleanup"
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/dbowm91/cargo-cleanme"
homepage = "https://github.com/dbowm91/cargo-cleanme"
documentation = "https://docs.rs/cargo-cleanme"
keywords = ["cargo", "cleanup", "subcommand", "disk-space", "artifacts"]
categories = ["command-line-utilities", "development-tools", "development-tools::cargo-plugins"]
# Explicit package allowlist. Every compile-time input is present and every
# repository-only surface is absent, so the published crate is a deliberate
# subset of the checkout rather than whatever Cargo happens to infer.
#
# `/config.toml` is a hard requirement, not a nicety: `src/config.rs` embeds
# this exact file with `include_str!("../config.toml")` and first-use config
# creation is impossible without it. `scripts/check-release-contract.py`
# fails the build if it is ever dropped from this list.
include = [
    "/src/**",
    "/config.toml",
    "/Cargo.toml",
    "/Cargo.lock",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE-MIT",
    "/LICENSE-APACHE",
]


[lib]
name = "cargo_cleanme"
path = "src/lib.rs"

[[bin]]
name = "cargo-cleanme"
path = "src/main.rs"

# Maintenance-only generator for shell completions and the manpage. It lives
# outside `src/`, so the `include` allowlist above keeps it out of the published
# package: these are release artifacts, not product surface.
[[bin]]
name = "generate-docs"
path = "xtask/src/main.rs"
required-features = ["dev-tools"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
directories = "6"
dua-core = "4.1"
filesize = "0.2"
globset = "0.4"
indicatif = { version = "0.18.6", features = ["in_memory"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "0.8"
# Self-update mechanics. Generic acquisition, transport, integrity, staging,
# and rollback are owned by the published Eggup crates, not reimplemented
# here.
#
# `eggup-curl` is the production transport: `eggup-acquisition` has zero
# dependencies, so the curl path adds no embedded HTTP/TLS stack to a CLI
# whose self-update is infrequent. `eggup-eggfetch` would add `eggfetch-core`
# plus rustls; that alternative was measured and rejected (see the M010C
# closure record). The transport is discovered at runtime and degrades to a
# typed adapter-unavailable result, never to a second production transport.
eggup-acquisition = "0.1.2"
eggup-core = "0.1.2"
eggup-curl = "0.1.2"
# Optional and feature-gated: only the completion/manpage generator needs them,
# so a normal build and `cargo install` never compile them.
clap_complete = { version = "4.5", optional = true }
clap_mangen = { version = "0.2", optional = true }

[features]
# Off by default so a normal build and `cargo install` never compile it.
dev-tools = ["dep:clap_complete", "dep:clap_mangen"]

[dev-dependencies]
tempfile = "3"

[target.'cfg(windows)'.dependencies]
# `Win32_Security` is required by `CreateFileW`, which the C009 test helper uses
# to open a directory handle with FILE_FLAG_BACKUP_SEMANTICS so a workspace
# root's mtime can actually be backdated on Windows.
windows-sys = { version = "0.59", features = ["Win32_Storage_FileSystem", "Win32_Security", "Win32_System_WindowsProgramming"] }
