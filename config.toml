# cargo-cleanme configuration template.
#
# This checked-in file is the single source of truth for `config init`.
# `src/config.rs` embeds this exact file, so editing this template changes
# what `config init` writes. Runtime configuration is resolved from the
# platform application config directory (or `--config PATH`); this
# repository file is a distribution template and is never loaded implicitly
# from the current working directory.
#
# Validate local edits with: `cargo test config_template`

[scan]
recency_seconds = 300

# Optional exclusive scope. A CLI scan root takes precedence.
# root = "/path/to/projects"

# These absolute glob-style filters apply only to global discovery.
ignore = []

# Exact absolute directories re-included beneath ignored trees.
unignore = []

[cleanup]
# Explicit cleanup authorization for private redirected output outside the
# `clean ROOT` sandbox. Entries must be absolute directory roots (not globs);
# symlink roots are invalid. Shared and uncertain output remains forbidden
# even inside an allowed root. An empty list preserves M004-style containment.
allowed_output_roots = []
