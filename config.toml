# cargo-cleanme configuration template.
#
# This checked-in file is the single source of truth for first-use config creation.
# `src/config.rs` embeds this exact file, so editing this template changes
# what first-use config creation writes. Runtime configuration is resolved from the
# platform application config directory (or `--config PATH`); this
# repository file is a distribution template and is never loaded implicitly
# from the current working directory.
#
# Validate local edits with: `cargo test config_template`

[scan]
recency_seconds = 300
# Retain learned developer roots for this many days after the last project observation.
# 0 disables expiration; accepted values are 0 through 3650.
learned_root_retention_days = 30

# Optional exclusive scope. A CLI scan root takes precedence.
# root = "/path/to/projects"

# These absolute glob-style filters apply only to global discovery.
ignore = []

# Exact absolute directories re-included beneath ignored trees.
unignore = []

[cleanup]
# Explicit cleanup location authorization for already-private output outside
# the `clean ROOT` sandbox. Entries must be absolute directory roots (not
# globs); symlink roots are invalid. Shared, uncertain, and external-unproven
# output remains inventory-only even inside an allowed root: authorization
# never manufactures ownership proof and cannot promote ExternalUnproven to
# private (ADR 001, C002). An empty list preserves M004-style containment.
# The field is currently operationally redundant because PrivateBounded output
# is normally workspace-contained, but is preserved for schema compatibility.
allowed_output_roots = []
