name: Post-release smoke

# The *real* self-update transaction, rehearsed against two public releases.
# This path found C016 and C017 while every fixture suite was green, which is
# the entire argument for keeping it: a green `cargo test` says nothing about
# whether the shipped binary can actually update a real installation.
#
# Two entry points (M011C):
#
#   release: published  - automatic. A real stable GitHub release is the only
#                         event worth a smoke, because a smoke tests published
#                         bytes. This is the reason the smoke is not
#                         "operator remembers to run it".
#   workflow_dispatch   - the explicit rehearsal/fallback surface, with an exact
#                         from/to pair chosen by a human.
#
# The automatic path resolves its own exact `from` (the greatest stable release
# below the target) through a tested resolver, and waits boundedly for crates.io
# to advertise the target -- because publication is ordered GitHub-release-first
# and `cargo publish`-second, and the updater resolves its download from
# crates.io. Running before the target version exists would test a transition
# that cannot happen. A wait that runs out of time FAILS; it never skips, since
# "the smoke did not run" and "the smoke passed" must never look alike in a
# closure record.
#
# No publication credentials, no write scope, no mutation outside each job's own
# temporary directory.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      from_version:
        description: Published version to start from, without the leading v
        required: true
        default: '0.1.6'
        type: string
      to_version:
        description: Published version to update to, without the leading v
        required: true
        default: '0.2.0'
        type: string

permissions:
  contents: read

jobs:
  # Resolved once, centrally, so all five lanes provably test the same transition
  # pair. Five independently-resolved pairs would be five chances to test
  # different versions while the summary claimed one.
  resolve-transition:
    name: Resolve the exact transition
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      from_version: ${{ steps.transition.outputs.from_version }}
      to_version: ${{ steps.transition.outputs.to_version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      # The event payload is re-validated rather than trusted. A future GitHub
      # change, a malformed payload, or a manually fired `release` event could
      # otherwise move the smoke onto a draft, a pre-release, or a tag that is
      # not a plain stable version.
      - name: Reject anything but a plain stable published release
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
          IS_DRAFT: ${{ github.event.release.draft }}
          IS_PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          if [[ "$IS_DRAFT" == "true" || "$IS_PRERELEASE" == "true" ]]; then
            echo "::error::$TAG is a draft=$IS_DRAFT prerelease=$IS_PRERELEASE; the smoke only covers published stable releases"
            exit 1
          fi
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::$TAG is not a plain stable vX.Y.Z tag; a floating or pre-release target makes the transition unreproducible"
            exit 1
          fi
          echo "target release: $TAG"

      - name: Resolve the exact previous release and wait for crates.io
        id: transition
        env:
          TAG: ${{ github.event.release.tag_name }}
          GH_TOKEN: ${{ github.token }}
          MANUAL_FROM: ${{ inputs.from_version }}
          MANUAL_TO: ${{ inputs.to_version }}
        run: |
          set -euo pipefail
          python3 scripts/resolve-smoke-transition.py --self-test
          if [[ "${{ github.event_name }}" == "release" ]]; then
            # Bounded wait on the same public authority the updater uses. The
            # default budget is finite and exhausting it is a failure, not a
            # skip.
            python3 scripts/resolve-smoke-transition.py --wait-crates-io --to "$TAG" \
              | tee resolve.log
          else
            # The resolver takes tags, not version numbers, and refuses anything
            # that is not a plain stable `vX.Y.Z`. The dispatch inputs are
            # documented as version numbers because that is what a human types,
            # so the prefix is added here rather than making the caller remember
            # it -- the previous default pair ('0.1.1', '0.1.2') would have been
            # rejected by its own workflow.
            python3 scripts/resolve-smoke-transition.py \
              --to "v$MANUAL_TO" --previous "v$MANUAL_FROM" \
              | tee resolve.log
          fi
          # `tee -o` is not an option on GNU coreutils `tee` ("tee: invalid
          # option -- 'o'"), so the earlier form could never have written the
          # step outputs. tee captures the log; the log is appended to
          # GITHUB_OUTPUT separately, which is what the output expression above
          # reads.
          cat resolve.log >> "$GITHUB_OUTPUT"
          {
            echo ""
            echo "## Resolved transition"
            echo ""
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| From | \`$(grep '^from_version=' resolve.log | cut -d= -f2)\` |"
            echo "| To | \`$(grep '^to_version=' resolve.log | cut -d= -f2)\` |"
            echo "| Mode | \`${{ github.event_name }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

  self-update:
    needs: resolve-transition
    name: '${{ matrix.target }}'
    # The runner for each target is asserted against the generated release
    # workflow by scripts/check-post-release-smoke-contract.py, so this matrix
    # cannot silently drift into a second, unguarded target list.
    strategy:
      # Not fail-fast. One platform's network or runner failure must still let
      # the other four produce evidence, and a smoke that stops at the first
      # failure has told the operator nothing about the other targets.
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-14
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
          - target: x86_64-apple-darwin
            runner: macos-15-intel
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Rehearse the released updater against public releases
        shell: bash
        env:
          FROM: ${{ needs.resolve-transition.outputs.from_version }}
          TO: ${{ needs.resolve-transition.outputs.to_version }}
        run: |
          set -euo pipefail
          python3 scripts/check-post-release-smoke-contract.py
          # The resolver emits TAGS (`v0.1.6`) because that is what its own
          # contract validates; `post-release-smoke.sh` builds its download URL
          # as `.../releases/download/v$version` and therefore wants bare
          # version numbers. Passing the tag through produced `vv0.1.6` and a
          # 404 on all five lanes. The prefix is stripped here, at the one place
          # the two conventions meet.
          bash scripts/post-release-smoke.sh \
            --target '${{ matrix.target }}' \
            --from "${FROM#v}" \
            --to "${TO#v}"
      - name: Record the lane result
        if: always()
        shell: bash
        env:
          FROM: ${{ needs.resolve-transition.outputs.from_version }}
          TO: ${{ needs.resolve-transition.outputs.to_version }}
        run: |
          {
            echo "| \`${{ matrix.target }}\` | \`$FROM\` → \`$TO\` | ${{ job.status }} |"
          } >> "$GITHUB_STEP_SUMMARY"
