name: CI
on: [push, pull_request]
jobs:
  checks:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --all-targets --all-features
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # The release consumer validator only ran inside the release workflow, so
      # a Windows-only defect in it stayed invisible until a release was
      # attempted. Running it here on every lane makes the validator itself a
      # tested surface, and the path is computed by Python so the same step
      # works on a Windows checkout.
      - name: Release-candidate smoke validator is itself portable
        shell: bash
        run: |
          candidate="target/debug/cargo-cleanme$(python -c "import sys; print('.exe' if sys.platform == 'win32' else '')")"
          python3 scripts/smoke-release-candidate.py "$candidate"
      # C013: the portability guard runs its own negative samples first, so a
      # guard that can no longer detect the C012 defect shape fails here rather
      # than passing quietly on a tree that no longer contains it.
      - name: Fixture portability guard is itself a real guard
        run: python3 scripts/check-fixture-portability.py --self-test
      - name: Fixture portability guard
        run: python3 scripts/check-fixture-portability.py
      # The deep dives cite source by line, so they drift silently whenever a
      # fix adds or removes lines above the citation. Same reasoning as the
      # fixture guard above: prove the guard can still fail before trusting it
      # to pass.
      - name: Architecture citation guard is itself a real guard
        run: python3 scripts/check-doc-citations.py --self-test
      - name: Architecture citations resolve
        run: python3 scripts/check-doc-citations.py
  installers:
    # Fixture-driven installer qualification. No test here contacts the public
    # GitHub service or a real release; the fixture server is local.
    #
    # On Windows the PowerShell wrapper is exercised for real. Elsewhere the
    # suite skips that block explicitly rather than reporting vacuous passes
    # from install.ps1's own platform guard.
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - name: Qualify the public installers against a local fixture release
        shell: bash
        run: python3 packaging/tests/test_installers.py
      # C013: the branch assertions the installer cases depend on are only
      # meaningful if they reject a broken setup. This is where the C012 class
      # of false green is proven to be detectable, and it runs on the Windows
      # lane specifically because that is where the defect lived.
      - name: Installer premise guards reject a broken setup
        shell: bash
        run: python3 packaging/tests/test_installers.py --self-test
  generated-docs:
    # Completions and the manpage are generated from the clap command model, so
    # a command change that was not regenerated must fail rather than ship a
    # stale manpage.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check completions and manpage match the clap model
        run: cargo run --quiet --features dev-tools --bin generate-docs -- --check
      - name: Check the release contract
        run: python3 scripts/check-release-contract.py
      # The exact-toolchain rule is the gate that keeps a rebuild of one tag from
      # using a different compiler, so it is verified in the failing direction
      # here rather than trusted because the tree currently passes.
      - name: Release contract rejects a floating release toolchain
        run: python3 scripts/check-release-contract.py --self-test
      # M011D: the Cargo selector support claim is a checked-in policy, so it is
      # gated the same way. Both directions run here because the product fails
      # closed on an unknown Cargo version, which means a stale allowlist never
      # crashes anything -- it just quietly stops offering a selector, and only
      # a static comparison can see that.
      - name: Cargo selector qualification matrix is a projection of the policy
        run: python3 scripts/check-selector-qualification.py
      - name: Selector qualification guard rejects matrix drift
        run: python3 scripts/check-selector-qualification.py --self-test
      - name: Selector qualification harness still distinguishes premise failures
        shell: bash
        run: bash scripts/qualify-cargo-selectors.sh --self-test
      # M011B: the staged validator is the repository's only end-to-end
      # "staged bytes == qualified bytes" check. Hosted, it is only an
      # enforcement point if it cannot be made to validate the wrong input, so
      # the guard is proved in the failing direction too.
      - name: Staged-release validation workflow is upstream-bound and read-only
        run: python3 scripts/check-staged-validation-contract.py
      - name: Staged-validation guard rejects a mis-bound workflow
        run: python3 scripts/check-staged-validation-contract.py --self-test
      - name: Check installer wrappers match the contract
        run: python3 scripts/check-installer-contract.py
      # M011C: the smoke is now automatic, so the things that keep "automatic"
      # from meaning "runs on unpublished bytes, or resolves latest, or skips
      # when crates.io is slow" become static premises.
      - name: Published-release smoke resolver and crates.io wait
        run: python3 scripts/resolve-smoke-transition.py --self-test
  benchmark:
    # Semantic counters are a hard gate; wall-clock timings are recorded and
    # printed but never fail the build, because shared-runner timing is noise.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: cargo build --release
      - run: python3 scripts/release-benchmark.py --check
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.89
      - run: cargo +1.89 check --locked --all-targets
      - run: cargo +1.89 test --locked --all-targets
