name: Validate staged release

# The hosted enforcement point for `scripts/validate-staged-release.py` (M011B).
#
# That validator is the repository's only end-to-end check of "staged bytes ==
# qualified bytes": exact inventory, served-byte SHA-256, release-manifest
# agreement, contract agreement, measured Linux ABI floors, and a real installer
# run. It has repeatedly caught real release-process defects, and until this
# workflow it was wired into nowhere -- a documented manual command that only ran
# when an operator remembered.
#
# It lives here rather than in `release-binaries.yml` because that file is
# generated by Eggpack and protected by a drift gate: hand-editing it would fail
# `eggpack ci check`. Eggpack stays the producer authority; this is the
# product-owned consumer layer.
#
# `workflow_run` rather than `push` or a second Eggpack job, because the draft is
# staged by the upstream run and the draft is the thing being validated. A rerun
# re-downloads and re-validates every byte: cached prior success is not evidence
# about bytes that may have changed.
#
# Least privilege, deliberately. `contents: read` and nothing else, no
# publication command anywhere in this file, and no long-lived credential. A
# compromised or buggy validation job must never hold publication authority --
# publication stays a separate human action after both this and Eggpack are green.

on:
  workflow_run:
    workflows: ['Eggpack candidate builds']
    types: [completed]
  # Recovery path. Takes an exact tag and, when validation is being re-run
  # against an upstream run this workflow could not bind automatically, that
  # run's id. It still re-proves tag/source identity from the checkout, so a
  # manual rerun cannot validate "latest" or a tag from an unrelated commit.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Exact release tag to validate, e.g. v0.1.7'
        required: true
        type: string
      source_run_id:
        description: 'Optional upstream Eggpack run id, e.g. 1234567890'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: validate-staged-release-${{ github.event.workflow_run.head_branch || inputs.tag || github.run_id }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate staged draft
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      # Least privilege: this job may read the repository and its releases. It
      # cannot write, publish, or upload a release.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Bind to the upstream run's exact head SHA, never the default branch.
          # A checkout of `main` would validate whatever the default branch
          # happens to contain, which is not the source the draft was staged
          # from -- and a validation that passed would attest to nothing.
          #
          # Kept on one line deliberately: a folded `>-` scalar that splits the
          # expression across lines is still a valid expression to GitHub, but
          # not to the contract checker that has to read this binding, and a
          # guard that cannot read its own subject is a guard that stopped
          # guarding.
          ref: ${{ github.event.workflow_run.head_sha || inputs.source_run_id && github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      # A failed upstream run is not a validation failure and not a pass: there
      # is no draft to validate, so this workflow makes no claim at all.
      - name: Require a successful upstream Eggpack run
        if: github.event_name == 'workflow_run'
        env:
          UPSTREAM_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          UPSTREAM_EVENT: ${{ github.event.workflow_run.event }}
        run: |
          if [[ "$UPSTREAM_EVENT" != "workflow_dispatch" ]]; then
            echo "::error::the upstream run was triggered by '$UPSTREAM_EVENT', not workflow_dispatch;" \
                 "only a deliberate operator-triggered release run may be validated"
            exit 1
          fi
          if [[ "$UPSTREAM_CONCLUSION" != "success" ]]; then
            echo "::error::the upstream Eggpack run concluded '$UPSTREAM_CONCLUSION';" \
                 "this workflow makes no validation claim about a run that did not succeed"
            exit 1
          fi
          echo "upstream run: ${{ github.event.workflow_run.id }}"
          echo "upstream head SHA: ${{ github.event.workflow_run.head_sha }}"

      # Bind the exact tag. For an automatic run it is derived from the trusted
      # checkout's own version, so a tag is never accepted on the strength of
      # the event payload alone.
      - name: Derive the exact release tag from the trusted checkout
        id: identity
        env:
          MANUAL_TAG: ${{ inputs.tag }}
        run: |
          derived=$(python3 - <<'PY'
          import re, pathlib
          text = pathlib.Path("Cargo.toml").read_text(encoding="utf-8")
          match = re.search(r'^version\s*=\s*"([^"]+)"', text, re.MULTILINE)
          if not match:
              raise SystemExit("no version in Cargo.toml")
          print(f"v{match.group(1)}")
          PY
          )
          if [[ "$derived" != "$MANUAL_TAG" ]]; then
            echo "::error::the requested tag '$MANUAL_TAG' does not match the version in the checked-out source ('$derived')"
            exit 1
          fi
          echo "tag=$derived" >> "$GITHUB_OUTPUT"
          echo "exact tag: $derived"

      # Re-prove the tag/source binding with the existing exact-identity gate
      # rather than trusting the derivation above on its own. This is the same
      # check the release contract enforces locally, and it is what makes a
      # manual rerun of an arbitrary tag impossible.
      - name: Re-prove exact tag and source identity
        env:
          TAG: ${{ steps.identity.outputs.tag }}
        run: |
          python3 scripts/check-release-identity.py --tag "$TAG"
          echo "tag and source identity re-proven from the trusted checkout"

      - name: Validate the staged draft against the qualified bytes
        id: validate
        env:
          TAG: ${{ steps.identity.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          python3 scripts/validate-staged-release.py --tag "$TAG" \
            2>&1 | tee staged-validation.log
          status=${PIPESTATUS[0]}
          if [[ $status -ne 0 ]]; then
            echo "::error::staged validation failed (exit $status); the draft remains unpublished"
            exit "$status"
          fi

      - name: Publish the validation summary
        if: always()
        env:
          TAG: ${{ steps.identity.outputs.tag }}
          UPSTREAM_RUN: ${{ github.event.workflow_run.id || inputs.source_run_id || 'manual' }}
        run: |
          {
            echo "## Staged release validation"
            echo ""
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Exact tag | \`$TAG\` |"
            echo "| Source SHA | \`${{ github.event.workflow_run.head_sha || github.sha }}\` |"
            echo "| Upstream Eggpack run | \`$UPSTREAM_RUN\` |"
            echo "| Validator | \`scripts/validate-staged-release.py\` |"
            echo "| Result | ${{ steps.validate.outcome || 'not run' }} |"
            echo ""
            echo "The draft is validated, not published. Publication is a separate human action."
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ -f staged-validation.log ]]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo '```text' >> "$GITHUB_STEP_SUMMARY"
            cat staged-validation.log >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

      # The draft is the authority being validated, so the release binaries are
      # deliberately NOT copied into a second long-lived artifact. Only the
      # validator's own log is retained, and briefly.
      - name: Retain the validation log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: staged-release-validation-${{ steps.identity.outputs.tag }}
          path: staged-validation.log
          if-no-files-found: warn
          retention-days: 7
